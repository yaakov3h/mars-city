name: Refresh Israel-skies aircraft snapshot
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aircraft-refresh
  cancel-in-progress: false
jobs:
  aircraft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/update-aircraft.mjs
      - id: changed
        run: |
          if git diff --quiet -- public/aircraft/israel-latest.json; then
            echo 'yes=false' >> "$GITHUB_OUTPUT"
          else
            echo 'yes=true' >> "$GITHUB_OUTPUT"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add public/aircraft/israel-latest.json
            git commit -m 'Refresh Israel-skies aircraft snapshot'
            git push
          fi
